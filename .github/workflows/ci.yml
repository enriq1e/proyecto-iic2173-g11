name: CI

on:
  push:
    branches:
      - main
      - develop
      - cicd2
  pull_request:
    branches:
      - main
      - develop
      - cicd2

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run tests
        run: npm test